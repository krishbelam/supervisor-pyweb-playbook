; Optional: serves a built React app. Get the real path with: which serve
[program:react_app]
directory=/home/deploy/myproject_fe                  ; CHANGE
command=/usr/local/bin/serve -s build -l 3000        ; CHANGE path if needed
user=deploy
environment=HOME="/home/deploy"
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/myproject_react.stderr.log
stderr_logfile_maxbytes=10MB
stdout_logfile=/var/log/myproject_react.out.log
stdout_logfile_maxbytes=10MB
