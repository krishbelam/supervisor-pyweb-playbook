; Django or Flask (WSGI). Replace the values marked CHANGE.
; Django: myproject.wsgi:application   Flask: app:app
[program:gunicorn]
directory=/home/deploy/myproject_be                  ; CHANGE: project root
command=/home/deploy/myproject_be/venv/bin/gunicorn --name=myproject --preload --bind unix:/tmp/myproject.sock --worker-class=gthread --workers 2 --threads 3 myproject.wsgi:application
user=deploy                                          ; CHANGE
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/log/myproject.stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/myproject.stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
