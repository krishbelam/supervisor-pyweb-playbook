; FastAPI (ASGI). Needs: pip install gunicorn uvicorn  in the virtualenv.
; Replace the values marked CHANGE. App module is file:variable, e.g. main:app
[program:gunicorn]
directory=/home/deploy/myproject_be                  ; CHANGE: project root
command=/home/deploy/myproject_be/venv/bin/gunicorn --name=myproject --preload --bind unix:/tmp/myproject.sock --worker-class=uvicorn.workers.UvicornWorker --workers 2 main:app
user=deploy                                          ; CHANGE
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/log/myproject.stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/myproject.stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
